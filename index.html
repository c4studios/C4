    <!-- The theme class, before first paint. ThemeProvider sets the same
         class once React mounts; setting it here means a dark-theme visitor
         never sees a light frame first. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('c4-theme-pref') || 'system';
          var d = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          /* The prerendered HTML carries the class the prerenderer ran with,
             so swap rather than add: one class, the visitor's, before paint. */
          root.classList.remove(d ? 'light-mode' : 'dark-mode');
          root.classList.add(d ? 'dark-mode' : 'light-mode');
        } catch (e) {}
      })();
    </script>

    <!-- The boot: a plain overlay that holds the page until the bundle has
         mounted and the fonts are in, then hands over. It covers the moment
         where a prerendered page used to flash, vanish and re-enter as the
         app hydrated. It is the C4 mark and nothing else: the mark builds the
         way the nav mark does (the C opens round its own centre, the 4 stands
         up, the arm strikes across), a slow sheen crosses it while it waits,
         then the sheet lifts. The viewBox holds the whole mark (x 44 to 639);
         the old one began at 265 and cut the C in half. Inline so it exists
         before any stylesheet arrives. -->
    <style>
      #c4-boot {
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-items: center;
        background: #F7F5F2;
        --boot-c: #b7b5b2; --boot-body: #414243; --boot-arm: #6c6d6d; --boot-sheen: 0.55;
      }
      html.dark-mode #c4-boot {
        background: #0F1115;
        --boot-c: #d0cecc; --boot-body: #9a9b9c; --boot-arm: #8a8b8c; --boot-sheen: 0.4;
      }
      #c4-boot .c4-boot__mark { display: block; width: clamp(84px, 8vw, 108px); height: auto; overflow: visible; will-change: transform, opacity; }
      #c4-boot .c4-boot__c { clip-path: circle(0% at 50% 50%); animation: c4-boot-open 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s forwards; }
      #c4-boot .c4-boot__body { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: c4-boot-rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards; }
      #c4-boot .c4-boot__arm { transform-box: fill-box; transform-origin: 0% 50%; transform: scaleX(0); animation: c4-boot-strike 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards; }
      #c4-boot .c4-boot__sheen { opacity: 0; animation: c4-boot-show 0.3s ease 0.95s forwards; }
      #c4-boot .c4-boot__peak { stop-opacity: var(--boot-sheen); }
      @keyframes c4-boot-open { to { clip-path: circle(100% at 50% 50%); } }
      @keyframes c4-boot-rise { to { transform: scaleY(1); } }
      @keyframes c4-boot-strike { to { transform: scaleX(1); } }
      @keyframes c4-boot-show { to { opacity: 1; } }
      #c4-boot.is-done { opacity: 0; transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
      #c4-boot.is-done .c4-boot__mark { transform: scale(1.06); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
      @media (prefers-reduced-motion: reduce) {
        #c4-boot .c4-boot__c, #c4-boot .c4-boot__body, #c4-boot .c4-boot__arm { animation: none; clip-path: none; transform: none; }
        #c4-boot .c4-boot__sheen { display: none; }
        #c4-boot.is-done { transition-duration: 0.15s; }
        #c4-boot.is-done .c4-boot__mark { transform: none; transition: none; }
      }
    </style>
  </head>

    <script>
      (function () {
        var boot = document.getElementById('c4-boot');
        if (!boot) return;
        /* The prerenderer must capture the boot in its resting state so that
           every static page carries it; nothing here runs under that UA. */
        var prerender = /Prerender/i.test(navigator.userAgent);
        var t0 = Date.now();
        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          boot.classList.add('is-ready');
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          setTimeout(function () {
            boot.classList.add('is-done');
            setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 600);
          }, reduce ? 60 : 640);
        }
        window.__c4BootReady = function () {
          if (prerender) return;
          var minShow = 450;
          var left = minShow - (Date.now() - t0);
          setTimeout(finish, left > 0 ? left : 0);
        };
        if (!prerender) setTimeout(finish, 5000);
      })();
    </script>
