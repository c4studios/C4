    <!-- The theme class, before first paint. ThemeProvider sets the same
         class once React mounts; setting it here means a dark-theme visitor
         never sees a light frame first. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('c4-theme-pref') || 'system';
          var d = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          /* The prerendered HTML carries the class the prerenderer ran with,
             so swap rather than add: one class, the visitor's, before paint. */
          root.classList.remove(d ? 'light-mode' : 'dark-mode');
          root.classList.add(d ? 'dark-mode' : 'light-mode');
        } catch (e) {}
      })();
    </script>

    <!-- The boot overlay, decided before first paint. It shows on the first
         page load of a visit only (Caleb, 15 Oct 2026: "keep it, but only
         for that first load in"); sessionStorage remembers the visit. The
         page underneath is the prerendered one and paints at once, and the
         app hydrates it in place (src/main.jsx), so the overlay waits for
         nothing but its own animation. A page whose HTML wasn't prerendered
         for its own address (a 404, /welcome, the dev server) is drawn from
         scratch over what's there, so on those the overlay still covers the
         swap until the app has mounted, as it always did. No attribute, no
         overlay: the prerenderer, a browser without JavaScript, and every
         later load in the visit. -->
    <script>
      (function () {
        try {
          if (/Prerender/i.test(navigator.userAgent)) return;
          var route = null;
          var record = document.getElementById('c4-prerender');
          if (record) route = JSON.parse(record.textContent).route;
          var here = location.pathname.replace(/\/+$/, '') || '/';
          var own = route !== null && (String(route).replace(/\/+$/, '') || '/') === here;
          var first = false;
          try {
            first = !sessionStorage.getItem('c4_boot_seen');
            sessionStorage.setItem('c4_boot_seen', '1');
          } catch (e) { first = false; }
          if (!own) document.documentElement.setAttribute('data-c4-boot', 'wait');
          else if (first) document.documentElement.setAttribute('data-c4-boot', 'intro');
          /* The stylesheets' @media (scripting: enabled) rules pose the
             prerendered page for the app that's about to hydrate it: the
             experience pages take their armed layout and the FAQ answers are
             drawn closed. If the app's script fails to load, nothing will
             take over, so drop those rules and leave the page as a browser
             without JavaScript shows it. */
          window.addEventListener('error', function (e) {
            var s = e.target;
            if (!s || s.tagName !== 'SCRIPT' || !/\/assets\/index-[^/]+\.js/.test(s.src || '')) return;
            var strip = function (rules, owner) {
              for (var i = rules.length - 1; i >= 0; i--) {
                var r = rules[i];
                if (r.media && /scripting:\s*enabled/.test(r.media.mediaText)) owner.deleteRule(i);
                else if (r.cssRules) strip(r.cssRules, r);
              }
            };
            for (var j = 0; j < document.styleSheets.length; j++) {
              try { strip(document.styleSheets[j].cssRules, document.styleSheets[j]); } catch (err) {}
            }
          }, true);
        } catch (e) {}
      })();
    </script>

    <!-- The boot: the C4 mark and nothing else, drawn the way Caleb picked on
         17 Oct 2026 (build B, "Stroke"). The C is wiped on by a straight
         front at the angle of its own top cut. The 4 is one stroke: the stem
         and the diagonal leave the apex together, the diagonal turns into the
         crossbar, the crossbar runs right through the cut into the green, and
         the T's stem drops last. Each stroke is a straight-edged ink sliding
         under a clip of its own piece, every front parallel to the edge its
         stroke ends on, so every frame is polygons with their true straight
         ends: no circle, no pivot, no wedge. src/components/c4/markBuild.js
         draws the same build for the nav and says where every number comes
         from. Where two pieces of one colour meet, one reaches over the join
         where the other is already drawn (or a cover comes on once both
         sides are), so no hairline shows. The C hands over to the finished
         mark at 0.48 s and the 4 at 0.96 s. Then a slow white sheen crosses
         it until the page is ready, and the sheet lifts. Reduced motion: the
         finished mark fades in over 0.2 s. The viewBox holds the whole mark
         (x 44 to 639). Inline so it exists before any stylesheet or script
         arrives. -->
    <style>
      #c4-boot {
        position: fixed; inset: 0; z-index: 1000;
        display: none; place-items: center;
        background: #F7F5F2;
        --boot-c: #b7b5b2; --boot-body: #414243; --boot-arm: #6c6d6d; --boot-sheen: 0.55;
      }
      html[data-c4-boot] #c4-boot { display: grid; }
      html.dark-mode #c4-boot {
        background: #0F1115;
        --boot-c: #d0cecc; --boot-body: #9a9b9c; --boot-arm: #8a8b8c; --boot-sheen: 0.4;
      }
      #c4-boot .c4-boot__mark { display: block; width: clamp(84px, 8vw, 108px); height: auto; overflow: visible; will-change: transform, opacity; }
      /* the strokes, each on the pen curve: C 0 to 0.48 s, stem 0.08 to 0.40,
         diagonal 0.08 to 0.52, crossbar 0.43 to 0.77, T stem 0.68 to 0.96 */
      #c4-boot .c4-boot__ink { animation: c4-boot-s 0.32s cubic-bezier(0.4, 0, 0.18, 1) 0.08s both; }
      #c4-boot .c4-boot__ink--c { animation-name: c4-boot-c; animation-duration: 0.48s; animation-delay: 0s; }
      #c4-boot .c4-boot__ink--d { animation-name: c4-boot-d; animation-duration: 0.44s; }
      #c4-boot .c4-boot__ink--x { animation-name: c4-boot-x; animation-duration: 0.34s; animation-delay: 0.43s; }
      #c4-boot .c4-boot__ink--t { animation-name: c4-boot-t; animation-duration: 0.28s; animation-delay: 0.68s; }
      @keyframes c4-boot-c { to { transform: translateX(511.129px); } }
      @keyframes c4-boot-s { to { transform: translateY(198.48px); } }
      @keyframes c4-boot-d { to { transform: translateY(262.87px); } }
      @keyframes c4-boot-x { to { transform: translateX(243.71px); } }
      @keyframes c4-boot-t { to { transform: translateY(112.28px); } }
      /* steps, no length: each stroke shows when its beat starts (an ink
         waiting on its start line would leave a hairline of edge there), and
         the cover on the diagonal's join with the crossbar comes on once the
         crossbar is 11 units past it (0.477 s) */
      #c4-boot .c4-boot__lead, #c4-boot .c4-boot__bar, #c4-boot .c4-boot__seam, #c4-boot .c4-boot__tee { opacity: 0; animation: c4-boot-on 0s 0.477s both; }
      #c4-boot .c4-boot__lead { animation-delay: 0.08s; }
      #c4-boot .c4-boot__bar { animation-delay: 0.43s; }
      #c4-boot .c4-boot__tee { animation-delay: 0.68s; }
      /* the hand-overs: as each part lands (the C at 0.48 s, the 4 at
         0.96 s) the finished part fades in over its build in 0.06 s, then
         the build fades out under it in 0.06 s. Chrome draws a clipped edge
         a hair differently from a filled one, so a straight swap would flick
         the edges; this way the finished mark takes over without a seam or a
         dip, and it is the last frame. */
      #c4-boot .c4-boot__c, #c4-boot .c4-boot__body, #c4-boot .c4-boot__arm { opacity: 0; animation: c4-boot-on 0.06s linear 0.96s both; }
      #c4-boot .c4-boot__c { animation-delay: 0.48s; }
      #c4-boot .c4-boot__cbuild { animation: c4-boot-off 0.06s linear 0.54s both; }
      #c4-boot .c4-boot__fbuild { animation: c4-boot-off 0.06s linear 1.02s both; }
      #c4-boot .c4-boot__sheen { opacity: 0; animation: c4-boot-on 0.3s ease 1s both; }
      #c4-boot .c4-boot__peak { stop-opacity: var(--boot-sheen); }
      @keyframes c4-boot-on { to { opacity: 1; } }
      @keyframes c4-boot-off { to { opacity: 0; } }
      #c4-boot.is-done { opacity: 0; transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
      #c4-boot.is-done .c4-boot__mark { transform: scale(1.06); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
      @media (prefers-reduced-motion: reduce) {
        #c4-boot .c4-boot__cbuild, #c4-boot .c4-boot__fbuild, #c4-boot .c4-boot__sheen { display: none; }
        /* important, because the site's own reduced-motion rule
           (src/styles/marks.css) cuts every animation to 0.01 ms once the
           stylesheet is in, and this fade is meant to take 0.2 s */
        #c4-boot .c4-boot__c, #c4-boot .c4-boot__body, #c4-boot .c4-boot__arm { animation: c4-boot-on 0.2s cubic-bezier(0.22, 1, 0.36, 1) 0s both !important; }
        #c4-boot.is-done { transition-duration: 0.15s; }
        #c4-boot.is-done .c4-boot__mark { transform: none; transition: none; }
      }
    </style>
  </head>

    <script>
      (function () {
        var boot = document.getElementById('c4-boot');
        if (!boot) return;
        /* The prerenderer must capture the boot in its resting state so that
           every static page carries it; nothing here runs under that UA. */
        if (/Prerender/i.test(navigator.userAgent)) return;
        var mode = document.documentElement.getAttribute('data-c4-boot');
        window.__c4BootReady = function () {};
        /* Not this load's to show: take it out before it can ever paint. */
        if (mode !== 'intro' && mode !== 'wait') {
          boot.parentNode.removeChild(boot);
          return;
        }
        var t0 = Date.now();
        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          boot.classList.add('is-ready');
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          setTimeout(function () {
            boot.classList.add('is-done');
            setTimeout(function () {
              if (boot.parentNode) boot.parentNode.removeChild(boot);
              document.documentElement.removeAttribute('data-c4-boot');
            }, 600);
          }, reduce ? 60 : 640);
        }
        /* The first load of a visit: the mark builds, holds, and lifts on the
           same beats it always had when the app was quick (450 ms, then the
           640 ms hold and the half-second fade), over a page that is already
           there. It doesn't wait for the bundle. */
        if (mode === 'intro') {
          setTimeout(finish, 450);
          return;
        }
        /* A page the app draws from scratch: hold until it has mounted and the
           fonts are in (src/main.jsx calls this), at least 450 ms, at most 5 s. */
        window.__c4BootReady = function () {
          var left = 450 - (Date.now() - t0);
          setTimeout(finish, left > 0 ? left : 0);
        };
        setTimeout(finish, 5000);
      })();
    </script>
